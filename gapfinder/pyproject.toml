[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gapfinder"
version = "0.1.0"
description = "Evidence-grounded research gap discovery pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pydantic>=2.7.4",
  "numpy>=1.26.0",
  "scipy>=1.10.0",
  "pytest>=8.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "scikit-learn>=1.4.0",
]
retrieval = [
  "sentence-transformers==4.1.0",
  "scikit-learn>=1.4.0",
]
faiss = [
  "faiss-cpu==1.11.0",
]
llm = [
  "google-genai>=2.0.0,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
